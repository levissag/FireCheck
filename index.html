<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireCheck</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
            color: #333;
        }

        .card {
            background: white;
            padding: 20px;
            max-width: 450px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h1, h2 {
            text-align: center;
        }

        .linha {
            margin: 8px 0;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #004c99;
        }

        #formVistoria {
            display: none;
            margin-top: 20px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 6px;
            border: 1px solid #aaa;
        }

        textarea {
            height: 80px;
        }
    </style>
</head>

<body>

<h1>FireCheck123</h1>

<div id="result" class="card">
    Carregando...
</div>

<script>

let codigoAtual = ""; // código do extintor

//--------------------------------------------
// CARREGAR EXTINTOR
//--------------------------------------------
async function carregarExtintor() {

    const params = new URLSearchParams(window.location.search);
    const cod = params.get("cod");

    codigoAtual = cod; // SALVA O CÓDIGO AQUI!

    if (!cod) {
        document.getElementById("result").innerText = "Código não informado.";
        return;
    }

    const urlCSV =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTU0F86l8__VCCuZ_eeAu4oDcAgxVR0kiZ2wuckk2O0giZP0JB44lcw1lfZd3gGVdXIZX0OdVzZSCMU/pub?output=csv";

    try {
        const response = await fetch(urlCSV);
        const csv = await response.text();

        const linhas = csv.split("\n").map(l => l.trim());
        const colunas = linhas[0].split(",").map(c => c.trim());
        const registros = linhas.slice(1).map(l => l.split(","));
        const alvo = registros.find(c => c[0].toLowerCase() === cod.toLowerCase());

        if (!alvo) {
            document.getElementById("result").innerText = "Extintor não encontrado.";
            return;
        }

        const ext = {};
        colunas.forEach((nome, i) => {
            ext[nome] = (alvo[i] || "").trim();
        });

        document.getElementById("result").innerHTML = `
            <h2>Dados do Extintor</h2>

            <div class="linha"><b>Código:</b> ${ext.codextin}</div>
            <div class="linha"><b>Esquadrão:</b> ${ext.esquadrao}</div>
            <div class="linha"><b>Prédio:</b> ${ext.predio}</div>
            <div class="linha"><b>Local:</b> ${ext.local}</div>
            <div class="linha"><b>Tipo:</b> ${ext.tipo}</div>
            <div class="linha"><b>Capacidade:</b> ${ext.capacidade}</div>
            <div class="linha"><b>Vistoriador:</b> ${ext.vistoriador}</div>
            <div class="linha"><b>Data da Vistoria:</b> ${ext.datavist}</div>

            <button class="btn" onclick="validarSenha()">Realizar Vistoria</button>

            <div id="formVistoria">
                <h3>Vistoria</h3>

                <label><b>Vistoriador:</b></label>
                <select id="vistoriador">
                    <option>S1 GUAZINA</option>
                    <option>S2 BRUNO PEREIRA</option>
                    <option>S2 CARVALHO</option>
                </select>

                <label><b>Data da Vistoria:</b></label>
                <input type="date" id="dataVist" value="${new Date().toISOString().split("T")[0]}">

                <label><b>Observações:</b></label>
                <textarea id="obs"></textarea>

                <button class="btn" onclick="enviarVistoria()">Salvar Vistoria</button>
            </div>
        `;

    } catch (e) {
        console.error(e);
        document.getElementById("result").innerText = "Erro ao carregar.";
    }
}

//--------------------------------------------
// SENHA
//--------------------------------------------
function validarSenha() {
    const senha = prompt("Digite a senha de vistoriador:");
    const senhaCorreta = "1234"; // ajustar depois

    if (senha === senhaCorreta) {
        document.getElementById("formVistoria").style.display = "block";
    } else {
        alert("Senha incorreta.");
    }
}

//--------------------------------------------
// ENVIAR VISTORIA
//--------------------------------------------
async function enviarVistoria() {

    const payload = {
        codextin: codigoAtual,
        vistoriador: document.getElementById("vistoriador").value,
        datavist: document.getElementById("dataVist").value,
        obs: document.getElementById("obs").value,
        senha: "12345"   // mesma senha no Apps Script
    };

    try {
        const resp = await fetch(
            "https://script.google.com/macros/s/AKfycbwr0E9GYCi_Xx1l5-zwbTTX34I3YyjEHjVdp0FUU2TliNTprlsW9m5aK1-g1rajwE_hGw/exec",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }
        );

        const result = await resp.json();

        if (result.status === "ok") {
            alert("✔ Vistoria salva com sucesso!");
        } 
        else if (result.status === "denied") {
            alert("Senha incorreta.");
        } 
        else {
            alert("Erro ao salvar: " + JSON.stringify(result));
        }

    } catch (e) {
        console.error(e);
        alert("Erro ao enviar vistoria: " + e);
    }
}

carregarExtintor(); // inicia ao abrir a página
    
</script>
</body>
</html>
